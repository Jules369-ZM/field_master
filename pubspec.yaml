name: field_master
description: Field Service Management Mobile App
version: 1.0.0+5
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  auth_repo:
    path: packages/auth_repo
  bloc: ^8.1.4
  cloud_firestore: ^5.4.4
  equatable: ^2.0.5
  firebase_app_check: ^0.3.1+3
  firebase_auth: ^5.3.1
  firebase_core: ^3.6.0
